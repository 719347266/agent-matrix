[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-matrix"
version = "0.4.2"
description = "会议与待办中心：会议、聊天、飞书任务三入口，实时监听 + 卡片简报 + 回复指令"
license = {text = "PolyForm-Noncommercial-1.0.0"}
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "python-dateutil>=2.9,<3", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
windows = ["pystray>=0.19", "Pillow>=10"]

[project.scripts]
agent-matrix = "agent_matrix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_matrix = ["app/*.html"]
