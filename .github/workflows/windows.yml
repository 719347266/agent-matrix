name: Windows client

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: ./windows/build.ps1
      - name: Try the build on a clean data folder
        shell: pwsh
        run: ./windows/smoke.ps1
      - name: Unit tests on Windows (for information)
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e ".[windows]"
          python -m unittest discover -s tests 2>&1 | Select-Object -Last 60
      - uses: actions/upload-artifact@v4
        with:
          name: Xinxiang-Windows
          path: dist/Xinxiang-Setup-*.exe
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null; if ($LASTEXITCODE -ne 0) { gh release create $tag --title "心响 $tag" --notes "Windows：下载 Xinxiang-Setup，双击安装，不需要另外装 Python。" }
          gh release upload $tag (Get-ChildItem dist/Xinxiang-Setup-*.exe).FullName --clobber
