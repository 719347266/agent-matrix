<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心响</title>
<link rel="icon" href="/icon.png">
<style>
/* 心响 · 工作台：左边导航，中间列表，右边详情。浅色为主，跟随系统深色。 */
:root{color-scheme:light;
--bg:#f7f7f8;--side:#f2f2f4;--panel:#ffffff;--hover:#f4f4f6;--sel:#eeedfc;--line:#e5e5ea;--line2:#efeff2;
--ink:#1c1c21;--ink2:#5d5d68;--ink3:#9b9ba5;
--brand:#5b4fe6;--brand-soft:#efedfd;--dot:#e8467c;
--blue:#2f6fe4;--blue-soft:#e9f0fd;--amber:#a8660b;--amber-soft:#fcf1de;--red:#d23e3e;--red-soft:#fcebea;
--green:#1f8a59;--green-soft:#e4f5ec;--violet:#7748d6;--violet-soft:#f1ebfc;--gray-soft:#f0f0f3;
--shadow:0 1px 2px rgba(16,16,24,.05),0 8px 24px rgba(16,16,24,.08);
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
--bg:#141418;--side:#18181d;--panel:#1d1d23;--hover:#24242b;--sel:#2a2746;--line:#2d2d35;--line2:#26262d;
--ink:#ececf1;--ink2:#a4a4af;--ink3:#6e6e79;--brand:#8279ff;--brand-soft:#2a2746;--dot:#ff5c93;
--blue:#6c9dff;--blue-soft:#1c2a45;--amber:#e3a548;--amber-soft:#3a2c15;--red:#f07272;--red-soft:#3d2023;
--green:#4cc38a;--green-soft:#163326;--violet:#ab8cff;--violet-soft:#2b2346;--gray-soft:#27272e;
--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4)}}
:root[data-theme=dark]{color-scheme:dark;
--bg:#141418;--side:#18181d;--panel:#1d1d23;--hover:#24242b;--sel:#2a2746;--line:#2d2d35;--line2:#26262d;
--ink:#ececf1;--ink2:#a4a4af;--ink3:#6e6e79;--brand:#8279ff;--brand-soft:#2a2746;--dot:#ff5c93;
--blue:#6c9dff;--blue-soft:#1c2a45;--amber:#e3a548;--amber-soft:#3a2c15;--red:#f07272;--red-soft:#3d2023;
--green:#4cc38a;--green-soft:#163326;--violet:#ab8cff;--violet-soft:#2b2346;--gray-soft:#27272e;
--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
::placeholder{color:var(--ink3)}
button:disabled{opacity:.5;cursor:wait}
.num{font-variant-numeric:tabular-nums}

/* frame */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);height:100vh}
.app.with-detail{grid-template-columns:228px minmax(380px,1fr) minmax(460px,46%)}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 16px;font-weight:650;font-size:15px}
.brand i{width:24px;height:24px;border-radius:7px;background:url(/icon.png) center/cover;flex:none}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:8px;color:var(--ink2);text-align:left;margin-bottom:1px}
.nav:hover{background:var(--hover);color:var(--ink)}
.nav.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .c{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.nav .c.hot{color:#fff;background:var(--dot);border-radius:99px;padding:0 7px;line-height:18px;font-weight:600}
.nav .c.need{color:var(--brand);font-weight:650}
.sep{height:1px;background:var(--line);margin:10px 8px}
.aicard{margin-top:auto;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;font-size:12.5px}
.aicard .h{display:flex;align-items:center;gap:8px;font-weight:600}
.aicard svg{width:30px;height:14px;flex:none}
.aicard path{fill:none;stroke:var(--ink3);stroke-width:1.6;stroke-linejoin:round}
.aicard.busy path{stroke:var(--blue);stroke-dasharray:20 40;animation:trace 1.6s linear infinite}
@keyframes trace{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.aicard .l{display:block;width:100%;border:0;background:none;padding:4px 0 0;text-align:left;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aicard .l:hover{color:var(--ink)}
.aicard .l span{color:var(--ink3)}

.main{display:flex;flex-direction:column;min-width:0;overflow:auto;container-type:inline-size}
.topbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar h1{font-size:16px;font-weight:650;margin:0;white-space:nowrap}
.topbar h1 .c{color:var(--ink3);font-weight:500;margin-left:6px}
.search{margin-left:auto;position:relative;flex:0 1 340px}
.search input{width:100%;padding-left:30px;background:var(--panel)}
.search svg{position:absolute;left:9px;top:50%;width:15px;height:15px;margin-top:-7.5px;stroke:var(--ink3);fill:none;stroke-width:1.8}
.content{padding:16px 24px 90px}
.demo{font-size:12.5px;color:var(--ink);padding:8px 24px;background:var(--amber-soft);border-bottom:1px solid var(--line)}
.demo label{margin-left:14px;cursor:pointer}

/* sections and rows */
.sec-h{display:flex;align-items:center;gap:8px;margin:20px 2px 8px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.sec-h:first-child{margin-top:4px}
.sec-h .n{color:var(--ink3);font-weight:500}
.sec-h .aside{font-weight:400;color:var(--ink3)}
.hint{font-size:12.5px;color:var(--ink3);margin:-2px 2px 10px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:8px 44px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:9px 12px 9px 10px;border-top:1px solid var(--line2);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row.ev{grid-template-columns:8px 68px minmax(0,1fr) auto auto}
.row.flat{cursor:default}.row.flat:hover{background:none}
.ud{width:7px;height:7px;border-radius:50%}
.unread .ud{background:var(--dot)}
.row .no{color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums}
.row .t{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.unread .t{font-weight:650}
.row .t.wrap{white-space:normal}
.row .s{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .s.wrap{white-space:normal}
.row .s b{color:var(--ink2);font-weight:600}
.late{color:var(--red)}
.row .meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink3);white-space:nowrap}
.row .meta .due{min-width:56px;text-align:right}
.row .meta .ago{min-width:58px;text-align:right}
.row .acts{display:flex;gap:6px;align-items:center}
.row q{display:block;font-size:12px;color:var(--ink3);margin-top:3px;quotes:"「" "」";white-space:normal}
.empty{padding:28px 16px;text-align:center;color:var(--ink3)}
.bar{height:3px;border-radius:2px;background:var(--blue-soft);margin-top:6px;overflow:hidden;max-width:220px}.bar i{display:block;height:100%;background:var(--blue)}
@container (max-width:760px){.row .meta .opt{display:none}}
@container (max-width:560px){.row{grid-template-columns:8px 36px minmax(0,1fr) auto}.row.ev{grid-template-columns:8px 68px minmax(0,1fr) auto}.row .meta{display:none}}

/* pills, avatars, buttons */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--gray-soft);color:var(--ink2)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}.pill.green{background:var(--green-soft);color:var(--green)}
.pill.violet{background:var(--violet-soft);color:var(--violet)}.pill.brand{background:var(--brand-soft);color:var(--brand)}
.pill .live{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.who{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:650;background:var(--gray-soft);color:var(--ink2);flex:none}
.who.ai{background:var(--brand-soft);color:var(--brand)}
.who.me{background:var(--ink);color:var(--panel)}
.btn{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.07);background:var(--brand)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.link{border-color:transparent;background:none;color:var(--brand);padding:0 6px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1px solid transparent;background:none;border-radius:7px;padding:3px 10px;font-size:12.5px;color:var(--ink2)}
.chip:hover{background:var(--hover);color:var(--ink)}
.chip.on{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600}
.inline{display:flex;gap:8px;padding:8px 12px 12px 62px;border-top:1px solid var(--line2);background:var(--hover)}
.inline input{flex:1}
.switch{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px;cursor:pointer;background:var(--panel)}
.switch .tr{margin-top:2px;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.15s}
.switch .tr:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on .tr{background:var(--brand)}.switch.on .tr:after{left:16px}
.switch b{font-weight:600}.switch span{font-size:12px;color:var(--ink3)}
.judge{font-size:12px;color:var(--ink2);margin-top:2px}.judge b{color:var(--brand);font-weight:600}

/* detail */
.detail{display:none;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-width:0;overflow:auto}
.app.with-detail .detail{display:flex}
.d-head{padding:16px 24px 14px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--panel);z-index:2}
.d-top{display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:12.5px}
.d-top .x{margin-left:auto}
.d-title{font-size:18px;font-weight:650;margin:6px 0 10px;line-height:1.4}
.props{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink2);align-items:center}
.props span{display:inline-flex;align-items:center;gap:6px}
.props em{font-style:normal;color:var(--ink3)}
.callout{margin:16px 24px 0;padding:12px 14px;border-radius:10px;background:var(--hover);border:1px solid var(--line2)}
.callout.amber{background:var(--amber-soft);border-color:transparent}.callout.red{background:var(--red-soft);border-color:transparent}
.callout.violet{background:var(--violet-soft);border-color:transparent}.callout.blue{background:var(--blue-soft);border-color:transparent}
.callout .what{margin-bottom:10px}
.callout .inline{padding:10px 0 0;border:0;background:none}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.d-sec{padding:20px 24px 0}
.d-sec h3{font-size:12.5px;font-weight:600;color:var(--ink2);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.d-sec h3 .n{color:var(--ink3);font-weight:500}
.src{font-size:13px;color:var(--ink2)}
.src .k{color:var(--ink3);margin-right:6px}
.src>div+div{margin-top:4px}
.quote{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:8px 0;color:var(--ink);line-height:1.75;white-space:pre-wrap;word-break:break-word}
.past{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.past .quote{color:var(--ink2)}
.thread{display:flex;flex-direction:column;gap:12px}
.m{display:flex;flex-direction:column;align-items:flex-start;max-width:92%}
.m.me{align-self:flex-end;align-items:flex-end}
.m .who-line{font-size:11.5px;color:var(--ink3);margin:0 4px 3px}
.m .who-line b{color:var(--ink2);font-weight:600;margin-right:6px}
.bub{background:var(--hover);border-radius:12px 12px 12px 4px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;line-height:1.65}
.m.me .bub{background:var(--brand-soft);border-radius:12px 12px 4px 12px}
.m.ask .bub{background:var(--red-soft)}
.steps{font-size:12px;color:var(--ink3);padding:0 4px}
.sys{align-self:center;font-size:12px;color:var(--ink3)}
.dv{width:min(540px,100%);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:10px;padding:10px 13px;line-height:1.65;background:var(--panel)}
.dv .top{display:flex;justify-content:space-between;gap:10px;font-weight:650;margin-bottom:4px}
.dv .q{margin-top:8px;padding:7px 10px;border-radius:8px;background:var(--amber-soft)}
.dv details{margin-top:6px;color:var(--ink2)}.dv summary{cursor:pointer;font-size:12px;color:var(--ink3)}
.dv ul{margin:4px 0 0;padding-left:18px}
.composer{position:sticky;bottom:0;margin-top:auto;padding:12px 24px 14px;background:var(--panel);border-top:1px solid var(--line2)}
.composer textarea{display:block;width:100%;min-height:62px;max-height:200px;resize:vertical;border-radius:10px}
.composer .bot{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--ink3)}
.composer .bot .btn{margin-left:auto}
.spacer{height:20px}
.solo{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.solo .d-head{position:static;border-radius:12px 12px 0 0}
.solo .composer{border-radius:0 0 12px 12px}

/* settings blocks */
.kv{display:grid;grid-template-columns:120px 1fr;gap:12px 16px;padding:14px 16px;align-items:center}
.kv>div:nth-child(odd){color:var(--ink3)}
.guide{padding:14px 16px}
.guide pre{white-space:pre-wrap;margin:0 0 12px;font:12px/1.7 ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink2)}

/* toasts and command results */
#actions{position:fixed;right:20px;bottom:20px;z-index:30;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 40px))}
#actions:empty{display:none}
.command-result{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;box-shadow:var(--shadow);font-size:12.5px;line-height:1.55}
.command-result>div{flex:1;min-width:0;overflow-wrap:anywhere}
.command-result.done{border-left-color:var(--green)}
.command-result.failed,.command-result.unknown{border-left-color:var(--red)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--panel);padding:9px 10px 9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.18s;pointer-events:none;z-index:40;box-shadow:var(--shadow);max-width:calc(100vw - 40px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:6px;padding:3px 10px;font-weight:600}
.toast:not(.act){padding-right:16px}.toast:not(.act) button{display:none}

@media (max-width:820px){
  .app,.app.with-detail{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh}
  .side{flex-direction:row;align-items:center;gap:2px;padding:8px 10px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
  .brand{padding:0 8px 0 2px}.brand span{display:none}
  .nav{width:auto;white-space:nowrap;padding:6px 9px}.nav svg{display:none}
  .sep,.aicard{display:none}
  .detail,.app.with-detail .detail{display:none}
  .main{overflow:visible}
  .topbar{flex-wrap:wrap;padding:10px 16px;top:49px}.search{flex-basis:100%}
  .content{padding:12px 16px 80px}
  .inline{padding-left:12px}
  .callout{margin:12px 14px 0}.d-head,.d-sec,.composer{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="topbar">
      <h1 id="ttl">心响</h1>
      <label class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
        <input id="q" placeholder="搜索事项，或输入指令（如 62 改 换成蓝色）" oninput="S.q=this.value.trim();render()" onkeydown="searchKey(event)" aria-label="搜索事项或输入指令"></label>
    </div>
    <div id="demo"></div>
    <div class="content" id="main"></div>
  </main>
  <section class="detail" id="detail" aria-label="事项详情"></section>
</div>
<div id="actions" role="status" aria-live="polite"></div>
<div class="toast" id="toast" role="status"><span id="toast-text"></span><button id="toast-btn"></button></div>
<script>
/* appearance: follow the system unless the owner picked one (remembered on this computer) */
const THEME_KEY="xinxiang-appearance";
function savedTheme(){ try{ return localStorage.getItem(THEME_KEY)||"auto"; }catch{ return "auto"; } }
function applyTheme(t){ if(t==="light"||t==="dark") document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme; }
function setTheme(t){ try{ localStorage.setItem(THEME_KEY,t); }catch{} applyTheme(t); render(); }
applyTheme(savedTheme());

let D = /*__DATA__*/null;            /* the prototype embeds data here; the app loads it from /api/state */
const TOKEN = /*__TOKEN__*/"";
const LIVE = !D;
let TODAY = (D && D.today) || new Date().toISOString().slice(0,10);
async function api(path, body){
  const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),12000);
  try {
    const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","X-Xinxiang-Token":TOKEN},
      ...(body?{body:JSON.stringify(body)}:{}),signal:controller.signal});
    const data=await r.json();
    if(!r.ok){ const e=new Error(data.reply||data.error||("服务返回 "+r.status)); e.confirmed=r.status===400; throw e; }
    return data;
  } finally { clearTimeout(timer); }
}
let failing = false, loadSequence=0, refreshTimer, newestSeen=0;
async function load(){
  const seq=++loadSequence;
  try{ const data=await api("/api/state"); if(seq!==loadSequence)return; D=data; TODAY=D.today; failing=false; syncCommands(); announce(); }
  catch(e){ if(seq!==loadSequence)return; failing=true; }
  if(failing || !openFromHash()) render();  // a notification or the menu may ask for one item or the inbox
  clearTimeout(refreshTimer);
  refreshTimer=setTimeout(load,commands().some(waiting)?1500:8000);
}
/* while the window is open, new things say so instead of waiting to be found */
function announce(){
  const top=Math.max(0,...D.inbox.map(m=>m.id));
  if(newestSeen && top>newestSeen){
    const fresh=D.inbox.filter(m=>m.id>newestSeen&&!m.read);
    if(fresh.length) toast(fresh.length===1?`新动态：${eventTitle(fresh[0])}`:`${fresh.length} 条新动态`,"查看",()=>{ S.view="inbox"; S.inboxTab="未读"; S.q=""; $("#q").value=""; if(!wide()) S.item=null; render(); });
  }
  newestSeen=top;
  const n=unreadCount(); document.title=n?`(${n}) 心响`:"心响";
}
const S = {view:null, item:null, inline:null, q:"", all:"进行中", doneTab:"已完成", inboxTab:null, openMsg:null, working:false, step:0, blocked:null};
// Requests stay visible across refreshes; an ambiguous transport error keeps the
// same ID for reconciliation instead of creating another write.
const localCommands = new Map();
try { for(const c of JSON.parse(sessionStorage.getItem("xinxiang-commands")||"[]")) localCommands.set(c.id,c); } catch {}
function keepCommands(){ try { sessionStorage.setItem("xinxiang-commands",JSON.stringify([...localCommands.values()])); } catch {} }
function commands(){
  const all=new Map((D?.commands||[]).map(c=>[c.id,c]));
  for(const c of localCommands.values()) all.set(c.id,c);
  return [...all.values()].sort((a,b)=>b.created-a.created);
}
const waiting = c => ["sending","queued","running","unknown"].includes(c.status);
const pendingFor = n => commands().find(c=>c.numbers.includes(n)&&(waiting(c)||c.status==="failed"));
function syncCommands(){
  for(const c of D.commands||[]) localCommands.delete(c.id);
  keepCommands();
}
function commandView(){
  const all=commands(), finished=all.filter(c=>c.status==="done"&&Date.now()/1000-(c.updated||c.created)<8).slice(0,3);
  return all.filter(c=>waiting(c)||c.status==="failed"||finished.includes(c)).map(c=>{
    const elapsed=Math.max(0,Math.floor(Date.now()/1000-c.created));
    const refs=c.message.startsWith("#")?"":c.numbers.map(n=>"#"+n).join("、");
    const extra=c.status==="unknown"?"":waiting(c)?`（已等 ${elapsed} 秒）`:"";
    const retry=["failed","unknown"].includes(c.status)?`<button class="btn" onclick="retryCommand('${c.id}')">核对并重试</button>`:"";
    const close=["done","failed"].includes(c.status)?`<button class="btn ghost" aria-label="收起处理结果" onclick="dismissCommand('${c.id}')">收起</button>`:"";
    return `<div class="command-result ${c.status}"><div><b>${esc(refs)}</b> ${esc(c.message)}${extra}${failing&&waiting(c)?"，连接中断，正在重新核对":""}</div>${retry}${close}</div>`;
  }).join("");
}
async function submitCommand(body,numbers,existing=null){
  if(!existing && numbers.some(n=>pendingFor(n))) return;
  const id=existing?.id || (globalThis.crypto?.randomUUID?.() || ("r"+Date.now().toString(36)+Math.random().toString(36).slice(2)));
  const c={id,numbers,text:body.text,payload:body,status:"sending",message:"正在提交",created:existing?.created||Date.now()/1000};
  localCommands.set(id,c); keepCommands(); render();
  try {
    const r=await api("/api/commands",{...body,request_id:id});
    localCommands.delete(id); localCommands.set(r.command.id,r.command);
    const box=$("#saybox");
    if(box&&numbers.length===1&&box.dataset.draft==="say-"+numbers[0]&&box.value.trim()&&body.text.endsWith(box.value.trim())){
      box.value=""; drafts.delete("say-"+numbers[0]);
    }
  } catch(e) {
    c.status=e.confirmed?"failed":"unknown";
    c.message=e.confirmed?e.message:"暂时没收到服务回执，请核对；重复点击不会再次提交。";
    localCommands.set(id,c);
  }
  keepCommands(); render(); await load();
}
async function retryCommand(id){
  const c=commands().find(c=>c.id===id); if(!c)return;
  if(c.payload) return submitCommand(c.payload,c.numbers,c);
  localCommands.set(id,{...c,status:"sending",message:"正在核对上次操作"}); render();
  try { const r=await api("/api/commands/retry",{id}); localCommands.delete(id); localCommands.set(r.command.id,r.command); }
  catch(e) { localCommands.set(id,{...c,status:"failed",message:e.message||"连接中断，请稍后核对"}); }
  keepCommands(); await load();
}
async function dismissCommand(id){
  try { await api("/api/commands/dismiss",{id}); localCommands.delete(id); D.commands=(D.commands||[]).filter(c=>c.id!==id); keepCommands(); render(); }
  catch(e){ toast("暂时连不上服务，处理结果已保留"); }
}

const drafts=new Map(), htmlCache=new Map();
function putHTML(selector,html){
  if(htmlCache.get(selector)===html)return false;
  $(selector).innerHTML=html; htmlCache.set(selector,html); return true;
}
function inlineForm(i){
  const f=S.inline;
  if(!f||f.n!==i.n)return "";
  return `<div class="inline" onclick="event.stopPropagation()"><input id="inline-${i.n}" data-draft="inline-${i.n}-${f.k}" placeholder="${esc(f.ph)}" onkeydown="if(event.key==='Enter')submitInline();if(event.key==='Escape'){S.inline=null;render()}"><button class="btn pri" data-n="${i.n}" onclick="submitInline()">确定</button><button class="btn ghost" onclick="S.inline=null;render()">取消</button></div>`;
}
function submitInline(){
  const f=S.inline, input=f&&$("#inline-"+f.n); if(!input||pendingFor(f.n))return;
  const value=input.value.trim();if(!value)return input.focus();
  input.value=""; drafts.delete("inline-"+f.n+"-"+f.k); S.inline=null; apply(f.n,f.k,value);
}
const DEMO_N = 45, DEMO_STEPS = ["1/4 读任务单和背景","2/4 读标签体系文档","3/4 写需求文档","4/4 自检"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byN = n => D.items.find(i => i.n === n);
const clock = () => new Date().toTimeString().slice(0,5);
function toast(t, label, fn){
  const el=$("#toast"); $("#toast-text").textContent=t;
  const b=$("#toast-btn"); b.textContent=label||""; b.onclick=()=>{ el.classList.remove("on"); fn&&fn(); };
  el.classList.toggle("act",!!label); el.classList.add("on");
  clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove("on"),label?8000:2600);
}
function ago(s){
  if(!s) return ""; const t=new Date(String(s).replace(" ","T")); if(isNaN(t)) return "";
  const m=Math.round((Date.now()-t)/6e4);
  if(m<1) return "刚刚"; if(m<60) return `${m} 分钟前`; if(m<24*60&&t.toDateString()===new Date().toDateString()) return `${Math.floor(m/60)} 小时前`;
  const y=new Date(Date.now()-864e5); if(t.toDateString()===y.toDateString()) return "昨天 "+String(s).slice(11,16);
  return String(s).slice(5,10).replace("-","/");
}
const live = i => !i.hidden && i.status !== "取消";
const active = i => live(i) && !["完成","待验收","待确认"].includes(i.status);
const late = i => i.due && i.due < TODAY && !["完成","取消","待验收"].includes(i.status);
function due(i){ if(!i.due||["完成","待验收","取消"].includes(i.status)) return ""; const d=Math.round((new Date(i.due)-new Date(TODAY))/864e5);
  return d<0?`逾期 ${-d} 天`:d===0?"今天到期":d===1?"明天到期":`${i.due.slice(5).replace("-","/")} 到期`; }
const whoText = i => ({"我":"你来做","AI":"AI 做","别人":"别人做"}[i.who]||"");
const cur = () => LIVE ? (D.worker && D.worker.current) : (S.working ? {n:DEMO_N, step:DEMO_STEPS[S.step], minutes:2+S.step*3} : null);
const doingList = () => LIVE ? ((D.worker && D.worker.doing) || []).filter(d => d.kind === "item" && d.n) : (cur() ? [cur()] : []);
const jobOf = i => doingList().find(d => d.n === i.n);
const isWorking = i => !["完成","取消","待确认"].includes(i.status) && !!jobOf(i);
const stepIndex = c => { const m=String(c&&c.step||"").match(/(\d)\s*\/\s*4/); return m ? Math.min(4,+m[1]) : 1; };
const blockedAI = i => i.who==="AI" && i.status==="卡住";
const needsYou = i => live(i) && (blockedAI(i) || (i.status==="待验收"&&!isWorking(i)) || (i.status==="待确认"&&i.who!=="别人"));
function addDays(d,k){ const x=new Date(d); x.setDate(x.getDate()+k); return x.toISOString().slice(0,10); }

/* ---------- what is new: unread inbox messages, per item ---------- */
const unreadCount = () => (D?.inbox||[]).filter(m=>!m.read).length;
function unreadOf(n){ return (D.inbox||[]).filter(m=>!m.read&&(m.refs&&m.refs.length?m.refs:[m.n]).includes(n)); }
function markItemRead(n){
  const ids=unreadOf(n).map(m=>m.id); if(!ids.length) return;
  for(const m of D.inbox) if(ids.includes(m.id)) m.read=true;
  if(LIVE) api("/api/read",{ids}).catch(()=>{});
  announce();
}
const KIND={done:["AI 交付","amber"],blocked:["AI 问你","red"],new:["新进来","violet"],pending:["条件到了","amber"],recall:["话题再现","blue"],
  brief:["简报",""],prep:["会前准备",""],weekly:["周报",""],system:["系统",""]};
function kindOf(m){ const k=KIND[m.kind]||["消息",""]; return m.kind==="system"&&String(m.title).startsWith("⚠")?["要处理","red"]:k; }
function eventTitle(m){ const i=(m.refs||[]).length===1&&byN(m.refs[0]); return i?`#${i.n} ${i.title}`:String(m.title||""); }

/* ---------- status of one item ---------- */
function statusOf(i){
  if(isWorking(i)) return ["AI 正在做","blue",true]; if(blockedAI(i)) return ["AI 问你","red"];
  if(i.status==="待验收") return ["等你验收","amber"]; if(i.status==="待确认") return i.who==="别人"?["待确认",""]:["等你定","violet"];
  if(i.status==="完成") return ["已完成","green"]; if(i.status==="取消") return ["不做",""]; if(i.status==="卡住") return ["卡住","red"];
  if(i.who==="AI") return ["AI 排队","blue"]; if(i.who==="我") return ["你来做",""]; return ["别人在做",""];
}
const pill = i => { const [l,c,livePulse]=statusOf(i); return `<span class="pill ${c}">${livePulse?'<span class="live"></span>':""}${l}</span>`; };
const avatar = i => i.who==="AI"?`<span class="who ai" title="AI 做">AI</span>`:i.who==="我"?`<span class="who me" title="你来做">我</span>`:`<span class="who" title="别人做">他</span>`;

/* ---------- actions ---------- */
const CMD={restore:n=>`${n} 恢复`,approve:n=>`${n} 过`,reject:(n,t)=>`${n} 退 ${t}`,revise:(n,t)=>`${n} 改 ${t}`,add:(n,t)=>`${n} + ${t}`,me:n=>`${n} 我来`,ai:n=>`${n} AI做`,cancel:n=>`${n} 不做`,
  done:n=>`${n} 完成`,date:(n,t)=>`${n} ${t}`,first:n=>`${n} 先做`,cont:n=>`${n} 继续`,answer:(n,t)=>`${n} + ${t}`};
/* one row, at most two quiet actions; everything else is in the detail panel */
function rowButtons(i){
  if(blockedAI(i)) return [["回答…","answer","pri","直接回答 AI 的问题"]];
  if(i.status==="待验收"&&!isWorking(i)) return [["通过","approve","pri"]];
  if(i.status==="待确认"&&i.who!=="别人") return [["我来","me",""],["交给 AI","ai","pri"]];
  return [];
}
function detailButtons(i){
  if(blockedAI(i)) return [["按现有资料先做出来","cont","pri"],["我自己来","me",""],["不做","cancel","ghost"]];
  if(isWorking(i)) return [["不做了","cancel",""],["我已经办完了","done",""]];
  if(i.status==="待验收") return [["通过","approve","pri"],["让 AI 改","focus",""],["不做","cancel","ghost"]];
  if(i.status==="待确认") return [["我来","me",""],["交给 AI","ai","pri"],["改日期…","date","","例如：周五 / 11-20"],["已经办完","done","ghost"],["不做","cancel","ghost"]];
  if(i.status==="完成") return [["让 AI 改","focus","pri"],["恢复（标错了）","restore","ghost"]];
  if(i.status==="取消") return [["恢复（标错了）","restore",""]];
  if(i.who==="AI") return [["先做这件","first","pri"],["改日期…","date","","例如：周五 / 11-20"],["已经办完","done","ghost"],["不做","cancel","ghost"]];
  if(i.who==="我") return [["完成","done","pri"],["交给 AI","ai",""],["改日期…","date","","例如：周五 / 11-20"],["不做","cancel","ghost"]];
  return [["改日期…","date","","例如：周五 / 11-20"],["不做","cancel","ghost"]];
}
function btn(i,[label,k,cls,ph]){ return `<button data-n="${i.n}" ${pendingFor(i.n)?"disabled aria-busy=\"true\"":""} class="btn ${cls||""}" onclick="event.stopPropagation();act(${i.n},'${k}',${ph?`'${ph}'`:"null"},this)">${label}</button>`; }
function act(n,k,ph,el){
  if(k==="focus"){ if(S.item!==n) openItem(n); setTimeout(()=>$("#saybox")?.focus(),30); return; }
  if(pendingFor(n))return;
  if(ph){ S.inline={n,k,ph};render();$("#inline-"+n)?.focus();return; }
  apply(n,k,null);
}
function say(n, from, kind, text){ (D.threads[n] ||= []).push({at:TODAY.slice(5)+" "+clock(), from, kind, text, driver: from==="ai"?"本机 GPT":""}); }
async function apply(n,k,arg){
  if(LIVE){
    if(pendingFor(n))return;
    const body=k==="answer"||k==="add"?{kind:"say",n,text:arg}:{kind:"cmd",text:CMD[k](n,arg)};
    return submitCommand(body,[n]);
  }
  const i=byN(n);
  const words={restore:"恢复",approve:"通过",reject:"退回："+arg,revise:"要改："+arg,add:"补充："+arg,answer:arg,me:"我自己来做",ai:"交给 AI 做",cancel:"不做了",done:"完成了",date:"改日期到 "+arg,first:"先做这件",cont:"按现有资料先做出来"}[k];
  say(n,"me","feedback",words);
  if(k==="restore"){ i.status="待确认"; i.finished=null; i.blocker=null; if(D.judgments) delete D.judgments[n]; }
  if(["cancel","done","approve"].includes(k) && n===DEMO_N){ S.working=false; clearInterval(demoWork.h); }
  if(k==="approve"||k==="done") { i.status="完成"; i.finished=TODAY; }
  if(["reject","revise","add","answer","cont"].includes(k)){ i.status="进行中"; if(k==="revise") i.who="AI"; i.blocker=null; setTimeout(()=>{ say(n,"ai","say", k==="revise"||k==="reject"?"收到，在上一版基础上改，改好出新版本。":"收到，接着这件事往下做，不从头来。"); render(); }, 900); }
  if(k==="me"){ i.who="我"; if(["待确认","卡住"].includes(i.status)) i.status="未开始"; }
  if(k==="ai"){ i.who="AI"; if(i.status==="待确认") i.status="未开始"; }
  if(k==="cancel") i.status="取消";
  if(k==="date") i.due_note=arg;
  toast(`已处理（相当于回复「${CMD[k](n,arg)}」）。原型，不改数据`);
  render();
}

/* ---------- rows ---------- */
function sub(i){
  if(isWorking(i)){ const c=jobOf(i); return `<div class="s"><b>${esc(c.driver||"AI")}</b> 正在做：${esc(String(c.step||"").replace(/^\d\/4\s*/,""))}，已 ${c.minutes} 分钟</div><div class="bar"><i style="width:${stepIndex(c)*25}%"></i></div>`; }
  if(blockedAI(i)) return `<div class="s wrap"><b>AI 问：</b>${esc(i.blocker)}</div>`;
  const j = D.judgments && D.judgments[i.n];
  if(j && i.status==="待确认") return `<div class="judge"><b>AI 判断：${esc({ai:"能独立做",prep:"需要你，AI 可先备材料",me:"需要你自己来",skip:"不用做",done:"已经办完"}[j.decision]||"")}</b>　${esc(j.reason||"")}</div>`;
  const dv=(D.deliverables[i.n]||[]).length;
  const parts=[i.source?`来自${esc(i.source)}`:"", dv&&["完成","待验收"].includes(i.status)?`AI 交付 v${dv}`:"", i.rejected&&i.status==="进行中"?"按你的意见在改":""].filter(Boolean);
  return parts.length?`<div class="s">${parts.join("　")}</div>`:"";
}
function row(i, opts={}){
  const unread=unreadOf(i.n).length>0, d=due(i);
  const open = (i.status==="待验收"||i.status==="完成") && i.url && !isWorking(i) ? `<a class="btn link" href="${esc(i.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">打开交付</a>` : "";
  return `<div class="row ${unread?"unread":""} ${S.item===i.n?"sel":""}" onclick="openItem(${i.n})"><span class="ud"></span><span class="no">#${i.n}</span>
    <div style="min-width:0"><div class="t">${esc(i.title)}</div>${sub(i)}</div>
    <div class="meta">${pill(i)}<span class="opt">${avatar(i)}</span><span class="due opt ${late(i)?"late":""}">${esc(d)}</span><span class="ago opt">${esc(ago(i.updated))}</span></div>
    <div class="acts">${open}${opts.noButtons?"":rowButtons(i).map(b=>btn(i,b)).join("")}</div></div>${inlineForm(i)}`;
}
const section=(title,items,extra="")=>items.length?`<div class="sec-h">${title}<span class="n">${items.length}</span>${extra}</div><div class="list">${items.map(i=>row(i)).join("")}</div>`:"";
const byDue=(a,b)=>(a.due||"9")>(b.due||"9")?1:(a.due||"9")<(b.due||"9")?-1:a.n-b.n;

/* ---------- pages ---------- */
function inboxPage(){
  const tab=S.inboxTab||(unreadCount()?"未读":"全部");
  const list=D.inbox.filter(m=>tab==="未读"?!m.read:true);
  // one row per item: its newest message, unread if any of its messages is
  const seen=new Set(), rows=[];
  for(const m of list){
    const one=(m.refs||[]).length===1&&byN(m.refs[0]);
    const key=one?"n"+one.n:"m"+m.id;
    if(seen.has(key)) continue; seen.add(key);
    const unread=one?unreadOf(one.n).length>0:!m.read, more=one?list.filter(x=>(x.refs||[]).length===1&&x.refs[0]===one.n).length-1:0;
    const [k,c]=kindOf(m);
    const click=one?`openItem(${one.n})`:`openMsg(${m.id})`;
    const body=S.openMsg===m.id&&m.text?`<div class="s wrap" style="margin-top:6px;color:var(--ink2)">${linkify(m.text)}</div>`:"";
    rows.push(`<div class="row ev ${unread?"unread":""} ${one&&S.item===one.n?"sel":""}" onclick="${click}"><span class="ud"></span><span class="pill ${c}" style="justify-self:start">${k}</span>
      <div style="min-width:0"><div class="t">${esc(one?`#${one.n} ${one.title}`:m.title)}</div><div class="s">${esc(one?m.title:(m.text||"").split("\n")[0])}${more>0?`　另有 ${more} 条`:""}</div>${body}</div>
      <div class="meta"><span class="ago">${esc(ago(m.at))}</span></div><div class="acts">${one?rowButtons(one).map(b=>btn(one,b)).join(""):""}</div></div>${one?inlineForm(one):""}`);
  }
  const tabs=["未读","全部"].map(k=>`<button class="chip ${k===tab?"on":""}" onclick="S.inboxTab='${k}';render()">${k}${k==="未读"&&unreadCount()?` ${unreadCount()}`:""}</button>`).join("");
  return `<div class="chips" style="align-items:center">${tabs}<span style="margin-left:auto"></span>${unreadCount()?`<button class="btn ghost" onclick="readAll()">全部标为已读</button>`:""}</div>
    <div class="list">${rows.join("")||`<div class="empty">${tab==="未读"?"没有新动态。新进来的事、AI 交付和提问都会出现在这里。":"还没有消息"}</div>`}</div>`;
}
function openMsg(id){ const m=D.inbox.find(x=>x.id===id); if(!m) return; if(!m.read){ m.read=true; if(LIVE) api("/api/read",{ids:[id]}).catch(()=>{}); announce(); } S.openMsg=S.openMsg===id?null:id; render(); }
function readAll(){ D.inbox.forEach(m=>m.read=true); if(LIVE) api("/api/read",{all:true}).catch(()=>{}); announce(); render(); }
function todoPage(){
  const v=D.items.filter(live);
  const blocked=v.filter(blockedAI), review=v.filter(i=>i.status==="待验收"&&!isWorking(i)).sort(byDue), fresh=v.filter(i=>i.status==="待确认"&&i.who!=="别人");
  const mine=v.filter(i=>i.who==="我"&&!["完成","取消","待确认","待验收"].includes(i.status)&&i.due&&i.due<=TODAY).sort(byDue);
  const freshBlock=`<div class="sec-h">新进来，等你定谁来做<span class="n">${fresh.length}</span></div>${autoSwitch()}`+(fresh.length?`<div class="list">${fresh.map(i=>row(i)).join("")}</div>`:`<div class="list"><div class="empty">没有新进来的事</div></div>`);
  return section("AI 问你，等你一句话",blocked)+section("等你验收",review)+freshBlock+section("你的事：今天到期或已逾期",mine)+closedByAI();
}
function doingPage(){
  const v=D.items.filter(i=>(active(i)&&!blockedAI(i))||isWorking(i));
  const q=(D.worker&&D.worker.queue)||[], pos=i=>q.indexOf(i.n)<0?99:q.indexOf(i.n);
  const working=v.filter(isWorking), ai=v.filter(i=>i.who==="AI"&&!isWorking(i)).sort((a,b)=>pos(a)-pos(b));
  const me=v.filter(i=>i.who==="我"&&!isWorking(i)).sort(byDue), others=v.filter(i=>i.who==="别人"&&!isWorking(i)).sort(byDue);
  return (section("AI 正在做",working,`<span class="aside">最多同时 10 件</span>`)+section("AI 排队",ai)+section("你来做",me)+section("别人在做",others))
    ||`<div class="list"><div class="empty">没有进行中的事</div></div>`;
}
function donePage(){
  const tab=S.doneTab, when=i=>i.finished||String(i.updated||"").slice(0,10);
  const list=D.items.filter(i=>!i.hidden&&i.status===(tab==="不做的"?"取消":"完成")).sort((a,b)=>when(b)>when(a)?1:when(b)<when(a)?-1:b.n-a.n);

  const w=D.worker||{}, list=doingList(), busy=list.length>0;
  const lines=busy?list.slice(0,3).map(d=>`<button class="l" onclick="openItem(${d.n})">#${d.n} ${esc((byN(d.n)||{}).title||d.title||"")}<span>　${esc(String(d.step||"").replace(/^\d\/4\s*/,""))}</span></button>`).join("")
    :(w.last&&w.last.n?`<button class="l" onclick="openItem(${w.last.n})">上一件 #${w.last.n} ${esc(w.last.outcome||"")}</button>`:`<div class="l">有新的事会自动开始</div>`);
  return `<div class="brand"><i></i><span>心响</span></div>`+nav.map(x=>x?`<button class="nav ${S.view===x[0]&&!S.q?"on":""}" onclick="go('${x[0]}')"><svg viewBox="0 0 16 16" aria-hidden="true">${ICON[x[0]]}</svg>${x[1]}${x[2]?`<span class="c ${x[3]}">${x[2]}</span>`:""}</button>`:`<div class="sep"></div>`).join("")+
    `<div class="aicard ${busy?"busy":""}"><div class="h"><svg viewBox="0 0 40 16" aria-hidden="true"><path pathLength="60" d="M0 9 L11 9 L14 5 L17 12 L20 2 L23 13 L26 9 L40 9"/></svg>${busy?`AI 正在做 ${list.length} 件`:"AI 空闲"}</div>${lines}</div>`;
}
function go(view){ S.view=view; S.q=""; $("#q").value=""; S.inline=null; S.openMsg=null; if(!wide()) S.item=null; render(); document.querySelector(".main").scrollTop=0; }
const TITLES={inbox:"收件箱",todo:"等我处理",doing:"进行中",done:"已完成",all:"全部事项",mem:"记忆",sys:"设置"};
function searchKey(e){
  if(e.key==="Escape"){ e.target.value=""; S.q=""; render(); return; }
  if(e.key!=="Enter") return;
  const v=e.target.value.trim();
  if(/^#?\d{1,5}\s*[^\d\s]/.test(v)||/^#?\d{1,5}(\s*[,，、]\s*\d{1,5})+\s*\S/.test(v)){ e.target.value=""; S.q=""; runCmd(v); }
}
async function runCmd(v){
  if(LIVE){ const numbers=(v.match(/^#?[\d\s、,，]+/)?.[0].match(/\d+/g)||[]).map(Number); if(numbers.some(n=>pendingFor(n)))return; return submitCommand({kind:"cmd",text:v},numbers); }
  const m=v.match(/^#?(\d+)\s*(.*)$/);
  if(m&&byN(+m[1])){ say(+m[1],"me","feedback",m[2]||v); toast(`已处理「${v}」。原型`); openItem(+m[1]); }
  else toast("格式：编号 + 动作，例如 44 过 / 44 改 加上竞品");
}
function demoBar(){ if(LIVE) return failing ? `连不上本机的心响服务。确认常驻监听程序在运行（菜单栏 ⋯ → 重启监听）。` : ""; if(!D.demo) return ""; return `原型：数据来自你的真实事项（${esc(D.generated_at)} 只读），按钮只在页面里模拟。演示：<label><input type="checkbox" ${S.blocked?"checked":""} onchange="demoBlock(this.checked)"> AI 卡住</label><label><input type="checkbox" ${S.working?"checked":""} onchange="demoWork(this.checked)"> AI 正在做</label>`; }
function demoBlock(on){ const i=byN(44); if(!i) return; if(on){ S.blocked={status:i.status,blocker:i.blocker,tried:i.tried}; Object.assign(i,{status:"卡住",blocker:"缺广告归因的实付和退款，收入 ROI 算不出来。能给一份收入导出吗？",tried:"数据平台查了两次都被限流；搜了飞书文档和群聊，没有收入明细"}); } else if(S.blocked){ Object.assign(i,S.blocked); S.blocked=null; } render(); }
function demoWork(on){ S.working=on; S.step=0; clearInterval(demoWork.h); if(on) demoWork.h=setInterval(()=>{ S.step=(S.step+1)%4; render(); },4000); render(); }
function render(){
  const focused=document.activeElement, focusKey=focused?.dataset?.draft;
  const selection=focusKey?[focused.selectionStart,focused.selectionEnd]:null;
  for(const field of document.querySelectorAll("#main [data-draft], #detail [data-draft]")) drafts.set(field.dataset.draft,field.value);
  putHTML("#actions",commandView());
  for(const b of document.querySelectorAll("[data-n]")) b.disabled=!!pendingFor(Number(b.dataset.n));
  if(!D){ $("#demo").className="demo"; $("#demo").innerHTML=failing?demoBar():"读取中…"; return; }
  $("#demo").className=(D.demo||failing)?"demo":""; $("#demo").innerHTML=demoBar();
  if(!S.view) S.view=unreadCount()?"inbox":"todo";
  if(S.item&&!byN(S.item)) S.item=null;
  const item=S.item&&byN(S.item), split=!!item&&wide(), solo=!!item&&!split;
  $("#app").classList.toggle("with-detail",split);
  putHTML("#side",sideHTML());
  const title=solo?`#${item.n}`:S.q?`搜索：${S.q}`:TITLES[S.view];
  const count={inbox:unreadCount(),todo:D.items.filter(needsYou).length}[S.view];
  putHTML("#ttl",esc(title)+(!S.q&&!solo&&count?`<span class="c">${count}</span>`:""));
  const page=S.q?searchPage:{inbox:inboxPage,todo:todoPage,doing:doingPage,done:donePage,all:allPage,mem:memPage,sys:sysPage}[S.view];
  let changed=putHTML("#main",solo?`<div class="solo">${itemView(item)}</div>`:page());
  changed=putHTML("#detail",split?itemView(item):"")||changed;
  if(changed){
    for(const field of document.querySelectorAll("#main [data-draft], #detail [data-draft]")){
      if(drafts.has(field.dataset.draft))field.value=drafts.get(field.dataset.draft);
      if(focusKey===field.dataset.draft){
        field.focus({preventScroll:true});
        if(selection&&field.setSelectionRange)field.setSelectionRange(...selection);
      }
    }
  }
}
// "#item-61" (a notification, the menu or a link) opens that item; "#inbox" opens the inbox.
function openFromHash(){
  const h=location.hash;
  if(h==="#inbox"&&D){ history.replaceState(null,"",location.pathname+location.search); S.view="inbox"; S.inboxTab="未读"; S.q=""; render(); return true; }
  const m=h.match(/^#item-(\d+)$/);
  if(!m||!D||!byN(+m[1])) return false;
  history.replaceState(null,"",location.pathname+location.search);
  if(!S.view) S.view="inbox";
  openItem(+m[1]);
  return true;
}
window.addEventListener("hashchange",()=>{ if(D) openFromHash(); });
let resizeTimer; window.addEventListener("resize",()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(render,120); });
document.addEventListener("keydown",e=>{
  const typing=["INPUT","TEXTAREA"].includes(document.activeElement?.tagName);
  if(e.key==="Escape"&&S.item&&!typing) closeItem();
  if(e.key==="/"&&!typing){ e.preventDefault(); $("#q").focus(); }
});
if(LIVE){ load(); } else render();
</script>
</body>
