<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心响</title>
<link rel="icon" href="/icon.png">
<style>
/* 心响 · 夜色心电监护：深靛蓝的夜，青色是 AI，粉色是"等你"。数字用 DIN，像监护仪读数。 */
:root{color-scheme:dark;
--bg:#100f26;--panel:#17163a;--raise:#232150;--line:#29275a;--ink:#efeeff;--ink2:#aaa8d8;--ink3:#7472a8;
--cyan:#5fe3ff;--pink:#ff5fc9;--chrome:#d7d9ee;--red:#ff6b86;--on-pink:#1a0619;
--cyan-soft:rgba(95,227,255,.11);--pink-soft:rgba(255,95,201,.12);--glow:0 0 20px rgba(255,95,201,.32);--glow-c:0 0 10px rgba(95,227,255,.5);
--num:"DIN Alternate","Avenir Next",ui-rounded,system-ui,sans-serif;
--big:"DIN Condensed","DIN Alternate","Avenir Next Condensed",system-ui,sans-serif;
--text:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
:root[data-theme=light]{color-scheme:light;
--bg:#f5f4fc;--panel:#ffffff;--raise:#ecebf8;--line:#e1dff1;--ink:#191840;--ink2:#53518a;--ink3:#8a88b5;
--cyan:#0784ab;--pink:#cc2494;--chrome:#4b4974;--red:#d2304f;--on-pink:#ffffff;
--cyan-soft:rgba(7,132,171,.08);--pink-soft:rgba(204,36,148,.07);--glow:0 0 0 3px rgba(204,36,148,.13);--glow-c:none}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--cyan);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
input:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft)}
::placeholder{color:var(--ink3)}
.demo{font-size:13px;color:var(--ink);text-align:center;padding:8px 16px;background:var(--pink-soft);border-bottom:1px solid var(--pink)}
.demo label{margin-left:14px;cursor:pointer}

/* header */
header{display:flex;align-items:center;gap:26px;padding:0 32px;height:60px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;letter-spacing:.08em;white-space:nowrap}
.logo i{width:28px;height:28px;border-radius:8px;background:url(/icon.png) center/cover;box-shadow:0 0 16px rgba(255,95,201,.35);flex:none}
nav{display:flex;gap:2px;align-self:stretch}
nav button{border:0;background:none;padding:0 12px;color:var(--ink2);position:relative;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);font-weight:600}
nav button.on:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--pink))}
nav b{font:400 13px/1 var(--num);color:var(--ink3);margin-left:6px}
nav b.hot{color:var(--on-pink);background:var(--pink);border-radius:99px;padding:3px 7px 2px;box-shadow:var(--glow)}
header .ai{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);border:0;background:none;padding:6px 0;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
header .ai:hover{color:var(--ink)}
header .ai svg{width:40px;height:16px;flex:none}
header .ai path{fill:none;stroke:var(--ink3);stroke-width:1.6;stroke-linejoin:round}
header .ai.busy{color:var(--ink)}
header .ai.busy path{stroke:var(--cyan);stroke-dasharray:22 38;animation:trace 1.5s linear infinite;filter:drop-shadow(0 0 3px var(--cyan))}
@keyframes trace{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.cmd input{width:210px;padding:7px 12px;font-size:13px;border-radius:8px}

main{max-width:1040px;margin:0 auto;padding:30px 32px 96px}

/* the monitor: the workflow as stations on one heartbeat line */
.monitor{position:relative;margin:0 0 36px;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:radial-gradient(90% 120% at 50% -30%,var(--raise),var(--panel) 62%)}
.monitor svg{display:block;width:100%;height:auto}
.monitor .grid line{stroke:var(--line);stroke-width:1;opacity:.55}
.monitor .trace{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(255,95,201,.5))}
.monitor.draw .trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.55,.1,.25,1) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.monitor .blip{fill:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan))}
.stations{display:grid;grid-template-columns:repeat(4,1fr);margin-top:-6px}
.station{border:0;background:none;text-align:center;padding:2px 8px 20px;position:relative;color:var(--ink2)}
.station .num{display:block;font:400 56px/1 var(--big);color:var(--ink);letter-spacing:.01em}
.station .name{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin-top:6px}
.station .sub{display:block;font-size:12px;color:var(--ink3);margin-top:2px}
.station:hover .name,.station.on .name{color:var(--ink)}
.station.need .num{color:var(--pink);text-shadow:0 0 24px rgba(255,95,201,.55)}
.station.on:after{content:"";position:absolute;left:50%;bottom:0;width:40px;height:3px;margin-left:-20px;border-radius:3px 3px 0 0;background:var(--ink2)}
.station.need.on:after{background:var(--pink);box-shadow:var(--glow)}

/* headings */
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2{font-size:19px;font-weight:600;margin:0;letter-spacing:.01em}
.count{font:400 19px/1 var(--num);color:var(--ink3)}
.hint{font-size:13px;color:var(--ink3);margin:4px 0 18px;max-width:46em}
.group{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:600;color:var(--ink2);margin:26px 0 6px}
.group .count{font-size:13px}
.group .aside{font-weight:400;color:var(--ink3)}

/* rows: no boxes, a status rail on the left */
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:13px 12px 13px 18px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.row:before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:3px}
.row.need:before{background:var(--pink);box-shadow:0 0 10px rgba(255,95,201,.6)}
.row.ai:before{background:var(--cyan);box-shadow:var(--glow-c)}
.row:hover{background:var(--panel)}
.row.flat{cursor:default}.row.flat:hover{background:none}
.row .n{font:400 15px/1 var(--num);color:var(--ink3);min-width:36px;padding-top:1px}
.row .main{flex:1;min-width:0}
.row .title{font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .title.wrap{white-space:normal}
.row .title.unread{font-weight:600}
.row .meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12px;color:var(--ink3);margin-top:3px}
.row .when{font:400 13px/1 var(--num);color:var(--ink3);white-space:nowrap}
.row q{display:block;font-size:12px;color:var(--ink3);margin-top:4px;quotes:"「" "」"}
.meta{font-size:12px;color:var(--ink3)}
.late{color:var(--red)}
.ask{font-size:13px;color:var(--pink);margin-top:4px}
.bar{height:3px;border-radius:2px;background:var(--cyan-soft);margin-top:8px;overflow:hidden;max-width:300px}
.bar i{display:block;height:100%;background:var(--cyan);box-shadow:var(--glow-c)}
.unread-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pink);margin-right:8px;vertical-align:2px;box-shadow:0 0 8px var(--pink)}
.empty{padding:22px 18px;color:var(--ink3);border-bottom:1px solid var(--line)}

/* buttons: quiet pills; pink is the one thing that wants you */
.btn{border:1px solid var(--line);background:transparent;color:var(--ink2);padding:6px 15px;border-radius:99px;font-size:13px;white-space:nowrap;transition:border-color .15s,color .15s,background .15s,box-shadow .15s}
.btn:hover{border-color:var(--ink3);color:var(--ink)}
.btn.pri{border-color:var(--pink);color:var(--pink)}
.btn.pri:hover{background:var(--pink);color:var(--on-pink);box-shadow:var(--glow)}
.now .btn.pri,.btn.solid{background:var(--pink);border-color:var(--pink);color:var(--on-pink)}
.now .btn.pri:hover,.btn.solid:hover{box-shadow:var(--glow)}
.btn.link{border-color:transparent;color:var(--cyan);padding-left:8px;padding-right:8px}
.btn.link:hover{color:var(--ink);text-decoration:none}
button:disabled{opacity:.5;cursor:wait}
.inline{display:flex;gap:8px;padding:10px 12px 14px 68px;border-bottom:1px solid var(--line)}
.inline input{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 16px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:4px 14px;font-size:13px;color:var(--ink2)}
.chip:hover{color:var(--ink);border-color:var(--ink3)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.switch{display:flex;align-items:flex-start;gap:14px;border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin:0 0 18px;cursor:pointer;background:var(--panel)}
.switch .tr{margin-top:2px;width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.15s}
.switch .tr:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch.on .tr{background:var(--cyan);box-shadow:var(--glow-c)}.switch.on .tr:after{left:19px}
.switch b{font-weight:600;color:var(--ink)}.switch span{font-size:12px;color:var(--ink3)}
.judge{font-size:12px;color:var(--ink2);margin-top:4px}.judge b{color:var(--cyan);font-weight:600}

/* one item, one story */
.back{border:0;background:none;color:var(--ink3);padding:0;margin-bottom:16px;font-size:13px}.back:hover{color:var(--ink)}
.ih{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ih h1{font-size:24px;font-weight:600;margin:0;line-height:1.35}
.ih h1 .n{font:400 24px/1 var(--num);color:var(--ink3);margin-right:10px}
.ih-sub{display:flex;gap:14px;font-size:13px;color:var(--ink2);margin-top:6px}
.state{font-size:12px;padding:3px 12px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.state.need{border-color:var(--pink);color:var(--pink);box-shadow:var(--glow)}
.state.ai{border-color:var(--cyan);color:var(--cyan)}
.state.done{color:var(--chrome)}
.story{position:relative;margin-top:30px;padding-left:36px}
.sec{position:relative;margin-bottom:32px}
.sec:not(:last-child):after{content:"";position:absolute;left:-27px;top:26px;bottom:-30px;width:2px;border-radius:2px;background:linear-gradient(var(--cyan),var(--pink));opacity:.45}
.sec .k{position:absolute;left:-36px;top:1px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid var(--cyan);color:var(--ink2);font:400 11px/16px var(--num);text-align:center}
.sec .k.hot{border-color:var(--pink);background:var(--pink);color:var(--on-pink);box-shadow:var(--glow)}
.sec h3{font-size:15px;font-weight:600;margin:0 0 12px}
.src{border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13px;background:var(--panel)}
.src+.src{margin-top:10px}
.src q{display:block;margin:10px 0;padding-left:12px;border-left:2px solid var(--pink);color:var(--ink);quotes:none;line-height:1.8}
.src .meta{display:block;font-size:12px;color:var(--ink3)}
.src .meta+.meta{margin-top:4px}
.src .past{margin-top:10px}
.src .past q{margin:6px 0 0;border-left-color:var(--line);color:var(--ink2)}
.thread{display:flex;flex-direction:column;gap:14px}
.m{display:flex;flex-direction:column;align-items:flex-start;max-width:88%}
.m.me{align-self:flex-end;align-items:flex-end}
.m .who{font-size:11px;color:var(--ink3);margin:0 6px 4px}
.m .who b{color:var(--ink2);font-weight:600;margin-right:6px}
.bub{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 16px 5px;padding:9px 14px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;line-height:1.7}
.m.me .bub{background:var(--raise);border-color:transparent;border-radius:16px 16px 5px 16px}
.m.ask .bub{border-color:var(--pink);background:var(--pink-soft)}
.steps{font-size:12px;color:var(--ink2);padding:2px 6px}
.steps span{font-family:var(--num);color:var(--ink3)}
.sys{align-self:center;font-size:12px;color:var(--ink3)}
.dv{width:min(560px,100%);border:1px solid transparent;border-radius:16px;padding:12px 15px;font-size:13.5px;line-height:1.7;
  background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,var(--cyan),var(--pink)) border-box}
.dv .top{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin-bottom:4px}
.dv .top a{font-weight:500}
.dv .q{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--pink-soft);color:var(--ink)}
.dv details{margin-top:8px;color:var(--ink2)}.dv summary{cursor:pointer;font-size:12px;color:var(--ink3)}
.dv ul{margin:6px 0 0;padding-left:18px}
.now{border-radius:18px;padding:16px 18px;background:var(--panel);border:1px solid var(--pink);box-shadow:var(--glow)}
.now .what{font-size:14px;margin-bottom:12px;color:var(--ink)}
.now .inline{padding:12px 0 0;border:0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.say{display:flex;gap:10px;margin-top:14px;align-items:flex-end}
.say textarea{flex:1;height:64px;resize:vertical;background:var(--bg)}
.kv{display:grid;grid-template-columns:112px 1fr;gap:10px 16px;font-size:13px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.kv>div:nth-child(odd){color:var(--ink3)}
.guide{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px 16px}
.guide pre{white-space:pre-wrap;margin:0 0 12px;font:12px/1.7 ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
#actions:empty{display:none}
#actions{max-width:1040px;margin:14px auto 0;padding:0 32px}
.command-result{display:flex;align-items:center;gap:10px;padding:9px 14px;margin:6px 0;border:1px solid var(--line);border-radius:12px;font-size:13px;line-height:1.6;background:var(--panel)}
.command-result>div{flex:1;min-width:0;overflow-wrap:anywhere}
.command-result.done{border-color:var(--cyan)}
.command-result.failed,.command-result.unknown{border-color:var(--red)}
@media (max-width:820px){
  header{flex-wrap:wrap;gap:6px 14px;height:auto;padding:10px 16px 0}
  nav{order:3;width:100%;overflow-x:auto;height:42px}
  .cmd{display:none}
  main{padding:20px 16px 80px}#actions{padding:0 16px}
  .station .num{font-size:42px}.station .sub{display:none}
  .row{flex-wrap:wrap;padding-left:16px;row-gap:8px}.row .main{flex-basis:calc(100% - 52px)}.row .main+.btn{margin-left:50px}
  .inline{padding-left:16px}.m{max-width:100%}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.monitor.draw .trace{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="demo"></div>
<header>
  <div class="logo"><i></i>心响</div>
  <nav id="nav"></nav>
  <button class="ai" id="ai"></button>
  <div class="cmd"><input id="cmdbox" placeholder="输入指令：44 过 / 44 + 要求" onkeydown="if(event.key==='Enter')runCmd()"></div>
</header>
<div id="actions" role="status" aria-live="polite"></div>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
const THEME_KEY="xinxiang-theme";
function savedTheme(){ try{ return localStorage.getItem(THEME_KEY)||"night"; }catch{ return "night"; } }
function setTheme(t){ try{ localStorage.setItem(THEME_KEY,t); }catch{} applyTheme(t); render(); }
function applyTheme(t){ if(t==="light") document.documentElement.dataset.theme="light"; else delete document.documentElement.dataset.theme; }
applyTheme(savedTheme());
let D = /*__DATA__*/null;            /* the prototype embeds data here; the app loads it from /api/state */
const TOKEN = /*__TOKEN__*/"";
const LIVE = !D;
let TODAY = (D && D.today) || new Date().toISOString().slice(0,10);
async function api(path, body, ms=12000){
  const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),ms);
  try {
    const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","X-Xinxiang-Token":TOKEN},
      ...(body?{body:JSON.stringify(body)}:{}),signal:controller.signal});
    const data=await r.json();
    if(!r.ok){ const e=new Error(data.reply||data.error||("服务返回 "+r.status)); e.confirmed=r.status===400; throw e; }
    return data;
  } finally { clearTimeout(timer); }
}
let failing = false, loadSequence=0, refreshTimer;
async function load(){
  const seq=++loadSequence;
  try{ const data=await api("/api/state"); if(seq!==loadSequence)return; D=data; TODAY=D.today; failing=false; syncCommands(); }
  catch(e){ if(seq!==loadSequence)return; failing=true; }
  if(failing || !openFromHash()) render();  // a notification or the menu may ask for one item
  clearTimeout(refreshTimer);
  refreshTimer=setTimeout(load,commands().some(waiting)?1500:8000);
}
const S = {inline:null, view:"home", stage:null, item:null, back:"home", all:"进行中", inbox:"全部", working:false, step:0, blocked:null};
// Requests stay visible across refreshes; an ambiguous transport error keeps the
// same ID for reconciliation instead of creating another write.
const localCommands = new Map();
try { for(const c of JSON.parse(sessionStorage.getItem("xinxiang-commands")||"[]")) localCommands.set(c.id,c); } catch {}
function keepCommands(){ try { sessionStorage.setItem("xinxiang-commands",JSON.stringify([...localCommands.values()])); } catch {} }
function commands(){
  const all=new Map((D?.commands||[]).map(c=>[c.id,c]));
  for(const c of localCommands.values()) all.set(c.id,c);
  return [...all.values()].sort((a,b)=>b.created-a.created);
}
const waiting = c => ["sending","queued","running","unknown"].includes(c.status);
const pendingFor = n => commands().find(c=>c.numbers.includes(n)&&(waiting(c)||c.status==="failed"));
function syncCommands(){
  for(const c of D.commands||[]) localCommands.delete(c.id);
  keepCommands();
}
function commandView(){
  const all=commands(), finished=all.filter(c=>c.status==="done"&&Date.now()/1000-(c.updated||c.created)<8).slice(0,3);
  return all.filter(c=>waiting(c)||c.status==="failed"||finished.includes(c)).map(c=>{
    const elapsed=Math.max(0,Math.floor(Date.now()/1000-c.created));
    const refs=c.message.startsWith("#")?"":c.numbers.map(n=>"#"+n).join("、");
    const extra=c.status==="unknown"?"":waiting(c)?` · 已等 ${elapsed} 秒`:"";
    const retry=["failed","unknown"].includes(c.status)?`<button class="btn" onclick="retryCommand('${c.id}')">核对并重试</button>`:"";
    const close=["done","failed"].includes(c.status)?`<button class="btn" aria-label="收起处理结果" onclick="dismissCommand('${c.id}')">收起</button>`:"";
    return `<div class="command-result ${c.status}"><div><b>${esc(refs)}</b> ${esc(c.message)}${extra}${failing&&waiting(c)?" · 连接中断，正在重新核对":""}</div>${retry}${close}</div>`;
  }).join("");
}
async function submitCommand(body,numbers,existing=null){
  if(!existing && numbers.some(n=>pendingFor(n))) return;
  const id=existing?.id || (globalThis.crypto?.randomUUID?.() || ("r"+Date.now().toString(36)+Math.random().toString(36).slice(2)));
  const c={id,numbers,text:body.text,payload:body,status:"sending",message:"正在提交，请稍候",created:existing?.created||Date.now()/1000};
  localCommands.set(id,c); keepCommands(); render();
  try {
    const r=await api("/api/commands",{...body,request_id:id});
    localCommands.delete(id); localCommands.set(r.command.id,r.command);
    if(body.kind==="say"){
      const box=$("#saybox");
      if(box&&box.dataset.draft==="say-"+body.n&&box.value.trim()===body.text){
        box.value="";drafts.delete("say-"+body.n);
      }
    }
  } catch(e) {
    c.status=e.confirmed?"failed":"unknown";
    c.message=e.confirmed?e.message:"暂时没收到服务回执，请核对；重复点击不会再次提交。";
    localCommands.set(id,c);
  }
  keepCommands(); render(); await load();
}
async function retryCommand(id){
  const c=commands().find(c=>c.id===id); if(!c)return;
  if(c.payload) return submitCommand(c.payload,c.numbers,c);
  localCommands.set(id,{...c,status:"sending",message:"正在核对上次操作"}); render();

const DEMO_N = 45, DEMO_STEPS = ["1/4 读任务单和背景","2/4 读标签体系文档","3/4 写需求文档","4/4 自检"];

/* ---------- the four stages of the workflow ---------- */
function stages(){
  const v=D.items.filter(live);
  const fresh=v.filter(i=>i.status==="待确认" && i.who!=="别人");
  const doing=v.filter(i=>(active(i)&&!blockedAI(i)) || isWorking(i));
  const wait=v.filter(i=>(i.status==="待验收"&&!isWorking(i)) || blockedAI(i));
  const week=addDays(TODAY,-7);
  const done=v.filter(i=>i.status==="完成" && (!i.finished || i.finished>=week));
  return [
    {key:"fresh", name:"新进来", items:fresh, need:fresh.length>0, sub:"等你定谁来做"},
    {key:"doing", name:"在做", items:doing, need:false, sub:`你 ${doing.filter(i=>i.who==="我").length}，AI ${doing.filter(i=>i.who==="AI").length}，别人 ${doing.filter(i=>i.who==="别人").length}`},
    {key:"wait", name:"等你验收", items:wait, need:wait.length>0, sub: wait.some(blockedAI)?`含 AI 卡住 ${wait.filter(blockedAI).length} 件`:"AI 和别人交回来的"},
    {key:"done", name:"完成", items:done, need:false, sub:"最近 7 天"},

}
function addDays(d,k){ const x=new Date(d); x.setDate(x.getDate()+k); return x.toISOString().slice(0,10); }

/* 首页的心电监护：四个阶段是一条心跳线上的站点。等你的那一站尖峰最高、发粉光；AI 在干活时有个亮点沿着线跑。 */
function monitor(st){
  const W=1000, H=92, B=56, xs=[125,375,625,875];
  let d=`M0 ${B}`;
  st.forEach((s,k)=>{ const x=xs[k], a=s.need?42:s.items.length?20:7;
    d+=` L${x-50} ${B} L${x-42} ${B-a*.2} L${x-35} ${B} L${x-14} ${B} L${x-7} ${B+a*.26} L${x+1} ${B-a} L${x+10} ${B+a*.42} L${x+17} ${B} L${x+34} ${B-a*.15} L${x+48} ${B}`; });
  d+=` L${W} ${B}`;
  const busy=LIVE?((D.worker&&D.worker.doing)||[]).length>0:!!cur();
  const calm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const first=!S.drawn; S.drawn=true;
  const grid=Array.from({length:19},(_,k)=>`<line x1="${(k+1)*50}" y1="0" x2="${(k+1)*50}" y2="${H}"/>`).join("")+[22,44,66].map(y=>`<line x1="0" y1="${y}" x2="${W}" y2="${y}"/>`).join("");
  const blip=busy&&!calm?`<circle r="5" class="blip"><animateMotion dur="3.6s" repeatCount="indefinite" path="${d}"/></circle>`:"";
  const stations=st.map(s=>`<button class="station ${s.key===S.stage?"on":""} ${s.need?"need":""}" aria-pressed="${s.key===S.stage}" onclick="S.stage='${s.key}';render()"><span class="num">${s.items.length}</span><span class="name">${s.name}</span><span class="sub">${s.sub}</span></button>`).join("");
  return `<section class="monitor ${first&&!calm?"draw":""}" aria-label="事项流程"><svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><linearGradient id="pulse" x1="0" x2="1"><stop offset="0" style="stop-color:var(--cyan)"/><stop offset="1" style="stop-color:var(--pink)"/></linearGradient></defs><g class="grid">${grid}</g><path class="trace" pathLength="1" stroke="url(#pulse)" d="${d}"/>${blip}</svg><div class="stations">${stations}</div></section>`;
}
function stageList(s){

function demoWork(on){ S.working=on; S.step=0; clearInterval(demoWork.h); if(on) demoWork.h=setInterval(()=>{ S.step=(S.step+1)%4; render(); },4000); render(); }
function render(){
  const viewKey=S.view+":"+(S.view==="item"?S.item:S.view==="home"?S.stage:S.view==="all"?S.all:"");
  const focused=document.activeElement, focusKey=focused?.dataset?.draft;
  const selection=focusKey?[focused.selectionStart,focused.selectionEnd]:null;
  for(const field of document.querySelectorAll("#main [data-draft]")) drafts.set(field.dataset.draft,field.value);
  putHTML("#actions",commandView());
  for(const b of document.querySelectorAll("[data-n]")) b.disabled=!!pendingFor(Number(b.dataset.n));
  if(!D){ $("#demo").className="demo"; $("#demo").innerHTML=failing?demoBar():"读取中…"; return; }
  $("#demo").className=(D.demo||failing)?"demo":""; $("#demo").innerHTML=demoBar();
  const st=stages(), need=st.filter(s=>s.need).reduce((a,s)=>a+s.items.length,0), unread=D.inbox.filter(m=>!m.read).length;
  const tabs=[["home","现在",need,true],["all","全部事项",0],["inbox","消息",unread],["mem","记忆",0],["sys","系统",0]];
  putHTML("#nav",tabs.map(([k,l,c,hot])=>`<button class="${S.view===k||(S.view==="item"&&S.back===k)?"on":""}" onclick="S.view='${k}';render()">${l}${c?`<b class="${hot?"hot":""}">${c}</b>`:""}</button>`).join(""));
  const w=D.worker||{}, c=cur(), many=LIVE?(w.doing||[]).length:0;
  const ecg=`<svg viewBox="0 0 40 16" aria-hidden="true"><path pathLength="60" d="M0 9 L11 9 L14 5 L17 12 L20 2 L23 13 L26 9 L40 9"/></svg>`;
  $("#ai").className="ai"+(many||c?" busy":"");
  putHTML("#ai",ecg+(many>1 ? `AI 正在同时做 ${many} 件` : c ? `${esc(c.driver||"AI")} 正在${c.n?`做 #${c.n}`:esc(c.title||"干活")}`
                         : `AI 空闲${w.last&&w.last.n?`，上一件 #${w.last.n} ${esc(w.last.outcome)}`:""}`));
  $("#ai").onclick=()=>{ const n=c&&c.n||(w.last&&w.last.n); if(n&&byN(n)) openItem(n); };
  const changed=putHTML("#main",{home,all:allPage,inbox:inboxPage,mem:memPage,sys:sysPage,item:itemPage}[S.view]());
  if(changed){
    for(const field of document.querySelectorAll("#main [data-draft]")){
      if(drafts.has(field.dataset.draft))field.value=drafts.get(field.dataset.draft);
      if(viewKey===renderedView&&focusKey===field.dataset.draft){
        field.focus({preventScroll:true});
        if(selection&&field.setSelectionRange)field.setSelectionRange(...selection);
      }
    }
  }
  renderedView=viewKey;
}
// "#item-61" (from a notification, the menu or a link) opens that item directly.
function openFromHash(){
  const m=location.hash.match(/^#item-(\d+)$/);
  if(!m||!D||!byN(+m[1])) return false;
  history.replaceState(null,"",location.pathname+location.search);
  openItem(+m[1]);
  return true;
}
window.addEventListener("hashchange",()=>{ if(D) openFromHash(); });
if(LIVE){ load(); } else render();
</script>
